spring.application.name=scrapbook-portfolio
spring.config.import=optional:file:.env[.properties]
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
portfolio.upload-dir=${UPLOAD_DIR:uploads}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
portfolio.notifications.feedback-recipient=${FEEDBACK_NOTIFICATION_TO:rezayusuf651@gmail.com}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scrapbook_portfolio}
spring.datasource.username=${DB_USERNAME:portfolio_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# For a portfolio starter, update tables automatically. For production, use Flyway migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Safer defaults for browser-facing responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set true behind HTTPS in production:
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

management.endpoints.web.exposure.include=health
