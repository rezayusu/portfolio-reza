<!doctype html>
<html lang="id" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111010">
  <title>Masuk — Reza Portfolio</title>
  <meta name="description" content="Masuk ke dashboard Reza Portfolio untuk mengelola konten, project, dan informasi portofolio.">
  <link rel="icon" href="/favicon.ico?v=2" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/login.css?v=5">
</head>
<body class="login-body">
  <main class="login-shell">
    <a class="login-brand" href="/" aria-label="Kembali ke beranda portfolio">
      <span class="login-brand-mark" th:if="${#strings.isEmpty(content.logoUrl)}">r.</span>
      <img class="login-brand-image" th:if="${!#strings.isEmpty(content.logoUrl)}" th:src="${content.logoUrl}" th:alt="|Logo ${content.displayName}|">
      <span th:text="${content.displayName}">Reza</span>
    </a>

    <section class="login-card" aria-labelledby="login-title">
      <span class="login-card-spark" aria-hidden="true">✳</span>
      <p class="login-eyebrow">CONTENT STUDIO</p>
      <h1 id="login-title">Welcome <span>Back</span></h1>
      <p class="login-subtitle">Masuk untuk mengelola portfolio kamu.</p>

      <div class="login-error" th:if="${loginError}" role="alert">
        Username atau password salah. Silakan coba lagi.
      </div>

      <form class="login-form" th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Masukkan username admin" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
        <button type="submit"><span>Masuk ke dashboard</span><span class="login-submit-icon" aria-hidden="true">↗</span></button>
      </form>

      <a class="login-return-link" href="/">← Kembali ke portfolio</a>
    </section>

    <p class="login-footer">© <span th:text="${content.displayName}">Reza</span> · dibuat dengan penuh perhatian</p>
  </main>
</body>
</html>
